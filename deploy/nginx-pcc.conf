# /etc/nginx/sites-available/pcc — frontend SPA + API gateway reverse proxy.
server {
    listen 80;
    server_name pcc.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pcc.example.com;

    ssl_certificate     /etc/letsencrypt/live/pcc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcc.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 30m;

    root /var/www/pcc;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All API traffic → gateway :8080 (loopback only)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
        client_max_body_size 30m;
    }

    location /actuator/ {
        return 404;
    }
}
