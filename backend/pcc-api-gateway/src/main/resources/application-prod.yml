server:
  address: ${SERVER_ADDRESS}
pcc:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL}
              predicates: [Path=/api/identity/**]
              filters:
                - StripPrefix=2
                - "RewriteResponseHeader=Set-Cookie, Path=/api/v1/auth, Path=/api/identity/api/v1/auth"
            - id: property
              uri: ${PROPERTY_SERVICE_URL}
              predicates: [Path=/api/property/**]
              filters: [StripPrefix=2]
            - id: land
              uri: ${LAND_SERVICE_URL}
              predicates: [Path=/api/land/**]
              filters: [StripPrefix=2]
            - id: finance
              uri: ${FINANCE_SERVICE_URL}
              predicates: [Path=/api/finance/**]
              filters: [StripPrefix=2]
            - id: documents
              uri: ${DOCUMENT_SERVICE_URL}
              predicates: [Path=/api/documents/**]
              filters: [StripPrefix=2]
            - id: workflows
              uri: ${WORKFLOW_SERVICE_URL}
              predicates: [Path=/api/workflows/**]
              filters: [StripPrefix=2]
            - id: reporting
              uri: ${REPORTING_SERVICE_URL}
              predicates: [Path=/api/reporting/**]
              filters: [StripPrefix=2]
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
                exposed-headers: [Content-Disposition]
                allow-credentials: true
                max-age: 3600
