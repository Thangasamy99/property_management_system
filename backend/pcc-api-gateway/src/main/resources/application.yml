server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pcc-api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:5000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:60s}
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
                # Refresh cookie is scoped to the downstream /api/v1/auth path;
                # rescope it so browsers send it through the gateway prefix.
                - RewriteResponseHeader=Set-Cookie, Path=/api/v1/auth, Path=/api/identity/api/v1/auth
            - id: property
              uri: ${PROPERTY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/property/**
              filters:
                - StripPrefix=2
            - id: land
              uri: ${LAND_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/land/**
              filters:
                - StripPrefix=2
            - id: finance
              uri: ${FINANCE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/finance/**
              filters:
                - StripPrefix=2
            - id: documents
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/documents/**
              filters:
                - StripPrefix=2
            - id: workflows
              uri: ${WORKFLOW_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/workflows/**
              filters:
                - StripPrefix=2
            - id: reporting
              uri: ${REPORTING_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/reporting/**
              filters:
                - StripPrefix=2
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
                exposed-headers: [Content-Disposition]
                allow-credentials: true
                max-age: 3600
  codec:
    max-in-memory-size: 30MB
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

pcc:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: pcc-identity-service
      audience: pcc-property-management

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.cloud.gateway: INFO
