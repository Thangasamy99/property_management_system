server:
  port: ${SERVER_PORT:8085}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: pcc-document-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pcc_document_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${DOC_MAX_FILE_SIZE:25MB}
      max-request-size: ${DOC_MAX_FILE_SIZE:25MB}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

pcc:
  storage:
    # private storage root - outside public/static dirs; S3 impl can replace local later
    root: ${DOC_STORAGE_ROOT:./document-storage}
    max-file-size: ${DOC_MAX_FILE_SIZE:26214400}
    allowed-mime: ${DOC_ALLOWED_MIME:application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
  integration:
    # external entity validation targets (relayed JWT, no DB coupling)
    property-service-url: ${PROPERTY_SERVICE_URL:http://localhost:8082}
    land-service-url: ${LAND_SERVICE_URL:http://localhost:8083}
    finance-service-url: ${FINANCE_SERVICE_URL:http://localhost:8084}
  security:
    jwt:
      # shared with pcc-identity-service: tokens are issued there and validated here
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:pcc-identity-service}
      audience: ${JWT_AUDIENCE:pcc-property-management}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.pcc.document: ${APP_LOG_LEVEL:INFO}
