spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/pcc_document_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

pcc:
  security:
    jwt:
      secret: test-secret-key-for-pcc-document-service-must-be-64-plus-characters!!
      issuer: pcc-identity-service
      audience: pcc-property-management
    cors:
      allowed-origins: http://localhost:3000
  storage:
    root: ${java.io.tmpdir}/pcc-doc-test-storage
    max-file-size: 4096
    allowed-mime: application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
