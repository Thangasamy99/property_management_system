server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: pcc-workflow-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pcc_workflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

pcc:
  workflow:
    retry-interval-ms: ${WF_RETRY_INTERVAL_MS:60000}
    max-retries: ${WF_MAX_RETRIES:10}
    default-escalation-days: ${WF_DEFAULT_ESCALATION_DAYS:3}
  integration:
    # downstream business-operation targets (relayed JWT, no DB coupling)
    property-service-url: ${PROPERTY_SERVICE_URL:http://localhost:8082}
    land-service-url: ${LAND_SERVICE_URL:http://localhost:8083}
    finance-service-url: ${FINANCE_SERVICE_URL:http://localhost:8084}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://localhost:8085}
  security:
    jwt:
      # shared with pcc-identity-service: tokens are issued there and validated here
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:pcc-identity-service}
      audience: ${JWT_AUDIENCE:pcc-property-management}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    com.pcc.workflow: ${APP_LOG_LEVEL:INFO}
