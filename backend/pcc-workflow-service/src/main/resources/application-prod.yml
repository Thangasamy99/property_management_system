server:
  address: ${SERVER_ADDRESS}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
pcc:
  integration:
    property-service-url: ${PROPERTY_SERVICE_URL}
    land-service-url: ${LAND_SERVICE_URL}
    finance-service-url: ${FINANCE_SERVICE_URL}
    document-service-url: ${DOCUMENT_SERVICE_URL}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
