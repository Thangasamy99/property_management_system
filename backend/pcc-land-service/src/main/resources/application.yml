server:
  port: ${SERVER_PORT:9003}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: pcc-land-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pcc_land_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

pcc:
  security:
    jwt:
      # shared with pcc-identity-service: tokens are issued there and validated here
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:pcc-identity-service}
      audience: ${JWT_AUDIENCE:pcc-property-management}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

logging:
  level:
    com.pcc.land: ${APP_LOG_LEVEL:INFO}
