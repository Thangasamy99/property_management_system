spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/pcc_reporting_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

pcc:
  security:
    jwt:
      secret: test-secret-key-for-pcc-reporting-service-must-be-64-plus-chars!!
      issuer: pcc-identity-service
      audience: pcc-property-management
    cors:
      allowed-origins: http://localhost:5173
  reporting:
    connect-timeout-ms: 800
    read-timeout-ms: 2000
    cache-ttl-seconds: 60
