server:
  port: ${SERVER_PORT:9007}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: pcc-reporting-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pcc_reporting_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pcc:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:pcc-identity-service}
      audience: ${JWT_AUDIENCE:pcc-property-management}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  reporting:
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:9002}
    property-url: ${PROPERTY_SERVICE_URL:http://localhost:9001}
    land-url: ${LAND_SERVICE_URL:http://localhost:9003}
    finance-url: ${FINANCE_SERVICE_URL:http://localhost:9004}
    document-url: ${DOCUMENT_SERVICE_URL:http://localhost:9005}
    workflow-url: ${WORKFLOW_SERVICE_URL:http://localhost:9006}
    connect-timeout-ms: ${REPORT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${REPORT_READ_TIMEOUT_MS:15000}
    cache-ttl-seconds: ${REPORT_CACHE_TTL_SECONDS:120}
    fetch-page-size: ${REPORT_FETCH_PAGE_SIZE:200}

logging:
  level:
    com.pcc.reporting: INFO
