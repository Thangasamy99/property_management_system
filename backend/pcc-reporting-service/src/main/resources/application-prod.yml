server:
  address: ${SERVER_ADDRESS}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
pcc:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  reporting:
    identity-url: ${IDENTITY_SERVICE_URL}
    property-url: ${PROPERTY_SERVICE_URL}
    land-url: ${LAND_SERVICE_URL}
    finance-url: ${FINANCE_SERVICE_URL}
    document-url: ${DOCUMENT_SERVICE_URL}
    workflow-url: ${WORKFLOW_SERVICE_URL}
