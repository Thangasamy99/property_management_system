spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/pcc_identity_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

pcc:
  security:
    jwt:
      secret: test-secret-key-for-pcc-identity-service-must-be-64-plus-chars!!
      issuer: pcc-identity-service
      audience: pcc-property-management
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
    lockout:
      max-failed-attempts: 5
      lock-duration-minutes: 15
    password-reset-token-ttl-minutes: 30
    cors:
      allowed-origins: http://localhost:5173
    bootstrap:
      admin-username: admin
      admin-email: admin@test.local
      admin-password: Admin@Test123
      admin-employee-code: PCC-0001
