server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: pcc-identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pcc_identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

pcc:
  security:
    jwt:
      # REQUIRED: set via JWT_SECRET env var (min 64 chars / 512-bit HS512 key material)
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:pcc-identity-service}
      audience: ${JWT_AUDIENCE:pcc-property-management}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    lockout:
      max-failed-attempts: ${SECURITY_MAX_FAILED_ATTEMPTS:5}
      lock-duration-minutes: ${SECURITY_LOCK_DURATION_MINUTES:15}
    password-reset-token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cookie:
      refresh-name: pcc_refresh_token
      secure: ${COOKIE_SECURE:false}
      same-site: Strict
    bootstrap:
      admin-username: ${PCC_ADMIN_USERNAME:admin}
      admin-email: ${PCC_ADMIN_EMAIL:admin@pcc-cameroon.local}
      admin-password: ${PCC_ADMIN_PASSWORD:}   # empty => generated once, printed to log
      admin-employee-code: ${PCC_ADMIN_EMPLOYEE_CODE:PCC-0001}
      admin-first-name: ${PCC_ADMIN_FIRST_NAME:System}
      admin-last-name: ${PCC_ADMIN_LAST_NAME:Administrator}

logging:
  level:
    com.pcc.identity: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
