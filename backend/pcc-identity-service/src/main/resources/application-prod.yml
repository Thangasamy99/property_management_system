server:
  address: ${SERVER_ADDRESS}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
pcc:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    cookie:
      secure: ${COOKIE_SECURE:true}
    bootstrap:
      admin-password: ${PCC_ADMIN_PASSWORD:}
